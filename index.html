<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vai Palmeiras! — Estilo verde, branco e vermelho</title>
  <style>
    :root {
      --verde-escuro: #0a5c35;
      --verde-medio: #11803d;
      --verde-claro: #38b66a;
      --vermelho: #d71920;
      --branco: #f7f7f7;
      --cinza: #e7e7e7;
      --texto: #112014;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--verde-escuro) 0%, var(--verde-medio) 38%, var(--branco) 38%, var(--branco) 100%);
      padding: 1rem;
      color: var(--texto);
    }

    .cartao {
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--verde-claro);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(10, 92, 53, 0.28);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .cartao::before,
    .cartao::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .cartao::before {
      background: linear-gradient(90deg, rgba(10, 92, 53, 0.08) 0%, rgba(10, 92, 53, 0.08) 33%, rgba(255,255,255,0) 33%, rgba(255,255,255,0) 66%, rgba(215,25,32,0.08) 66%, rgba(215,25,32,0.08) 100%);
    }

    .emoji { font-size: 4rem; }
    h1 {
      margin: .5rem 0;
      color: var(--verde-escuro);
      font-size: clamp(2rem, 4vw, 2.7rem);
    }

    .subtitulo {
      margin: 0 0 1.5rem;
      font-weight: 700;
      color: var(--vermelho);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .versao {
      margin-top: 1.5rem;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cinza), #ffffff);
      text-align: left;
      line-height: 1.8;
      border: 1px solid rgba(10, 92, 53, 0.15);
      position: relative;
      z-index: 1;
    }

    code {
      background: rgba(10, 92, 53, 0.08);
      color: var(--verde-escuro);
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(10, 92, 53, 0.18);
      color: var(--verde-escuro);
      font-size: .85rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="emoji">💚</div>
    <h1>Vai Palmeiras!</h1>
    <p class="subtitulo">verde, branco e vermelho</p>
    <p>Visual atualizado com a energia do time e o espírito da Itália.</p>

    <div class="versao">
      🤖 <strong>Publicado pelo robô em:</strong> __DATA__<br>
      🔖 <strong>Commit:</strong> <code>__COMMIT__</code><br>
      👤 <strong>Enviado por:</strong> __AUTOR__
    </div>

    <footer>
      🎓 UNINOVE · Automação de Processos · DevOps<br>
      Prof. Marcelino Dias da Silva
    </footer>
  </main>
</body>
</html>
